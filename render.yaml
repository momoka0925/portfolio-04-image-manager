# Render Blueprint: PostgreSQL + バックエンド(FastAPI/Docker)
databases:
  - name: portfolio-04-image-manager-db
    plan: free

services:
  - type: web
    name: portfolio-04-image-manager-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-04-image-manager-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
