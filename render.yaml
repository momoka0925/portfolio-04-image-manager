# Render Blueprint: バックエンド(FastAPI/Docker)
# 無料枠のPostgreSQLはアカウントに1つまでのため、本デモではメタデータをSQLite(揮発)で運用する。
# （ファイル自体も無料枠のディスクで揮発するため、メタとファイルの状態が一致して整合的）
# 本番でPostgreSQLを使う場合は DATABASE_URL を渡すだけで切り替わる（コードは postgresql:// を正規化済み）。
services:
  - type: web
    name: portfolio-04-image-manager-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
